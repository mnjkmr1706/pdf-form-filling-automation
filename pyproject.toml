[project]
name = "pdf_parser"
version = "0.1.0"
description = "PDF parser for claims forms"
requires-python = ">=3.9"
dependencies = [
    "azure-ai-documentintelligence>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "openai>=1.50.0",
    "pymupdf>=1.24.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "jupyter>=1.1.1",
    "nbclient>=0.10.2",
    "nbformat>=5.10.4",
]
